# 节点4配置 —— 单机回环版
id 4

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP> [bind <本地IP>] [dev <网卡>] [type <eth|wifi|bt>]
port 1 int        4001 127.0.0.1 3002              # 连节点2 端口2
port 2 int        4002 127.0.0.1 2003              # 连节点3 端口3
port 3 ext 0x0D   4103 127.0.0.1 9004 type eth     # 下行逻辑信道1(网络0x0D) 有线 -> 主机9004

# ---- 内部转发表 ----
ift 0101 1,2        # 节点1 -> 经节点2(端口1) 或 经节点3(端口2), 负载均衡
ift 0102 1          # 节点2 -> 端口1
ift 0103 2          # 节点3 -> 端口2
ift 0A00 1,2        # 上行信道(0x0A) -> 两条路径, 负载均衡
ift 0B00 1          # 下行信道3(0x0B) -> 经节点2(端口1)
ift 0C00 2          # 下行信道5(0x0C) -> 经节点3(端口2)
# 0x0D 直连本节点外部端口3，不需要转发表项（外部端口表命中）
