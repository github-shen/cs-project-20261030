# 节点1配置 —— 单机回环版（全部 127.0.0.1，课堂演示/截图用）
# 走 OVS 用 config-ovs/；跨机用真实网卡IP，见 README「多机部署」
#
# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP> [bind <本地IP>] [dev <网卡>] [type <eth|wifi|bt>]
id 1

# ---- 端口 ----
port 1 int        1101 127.0.0.1 3001              # 连节点2 端口1
port 2 int        1102 127.0.0.1 2002              # 连节点3 端口2
port 3 ext 0x0A   1103 127.0.0.1 9001 type eth     # 上行逻辑信道(网络0x0A) 有线 -> 主机9001

# ---- 内部转发表 ----
# ift <目的键hex> <端口1[,端口2]>   两个端口为等价路径, 按流哈希负载均衡
ift 0102 1          # 目的节点2 -> 端口1
ift 0103 1,2        # 目的节点3 -> 经节点2(端口1) 或 直连节点3(端口2)
ift 0104 1          # 目的节点4 -> 经节点2(端口1)
ift 0B00 1          # 下行信道3(网络0x0B) -> 经节点2
ift 0C00 1,2        # 下行信道5(网络0x0C) -> 两条路径, 负载均衡
ift 0D00 1          # 下行信道1(网络0x0D) -> 经节点2->节点4
