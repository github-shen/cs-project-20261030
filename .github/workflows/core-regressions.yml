name: Switch core regressions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'config-bt/**'
      - 'scripts/bluetooth.py'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/core-regressions.yml'
permissions:
  contents: read
jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbluetooth-dev python3
      - name: Build and validate frame handling
        run: |
          make bluetooth CFLAGS='-Wall -Wextra -Werror -O2'
          python3 -m unittest discover -s tests -p 'test_bluetooth_config.py' -v
          python3 tests/udp_regression.py -v
          python3 tests/test_switch_regressions.py --output logs/core
      - name: Validate concurrent learning
        run: |
          gcc -Wall -Wextra -Werror -O2 -pthread tests/test_learning.c src/frame.c -o bin/test-learning
          bin/test-learning > logs/learning.log
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-regressions
          path: logs/
          if-no-files-found: warn
