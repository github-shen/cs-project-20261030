# 节点1配置 —— 应用场景演示版（单机回环，配合 scripts/app_demo.sh）
# 与 config/ 的唯一区别：多一条"故障链路"端口4，用来演示快速重路由
id 1

port 1 int        1101 127.0.0.1 3001              # 连节点2 端口1（健康）
port 2 int        1102 127.0.0.1 2002              # 连节点3 端口2（健康）
port 3 ext 0x0A   1103 127.0.0.1 9001 type eth     # 上行信道 0x0A：三家门店终端
port 4 int        1104 10.255.255.1 3999           # 故障链路：对端不可达（脚本加 unreachable 路由模拟断线）

# ---- 内部转发表 ----
ift 0102 1
ift 0103 1,2
ift 0104 1
ift 0B00 1
ift 0C00 2,4        # 去库存库(0x0C)：端口2 正常 / 端口4 故障 → 命中 4 时自动切换到 2
ift 0D00 1
