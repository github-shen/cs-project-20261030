# 节点1 —— 双介质部署模板（@XXX@ 占位符由 scripts/nic.sh gen 替换成真实 IP）
# 跑在 A 机。端口2 = 域内 1—3 链路，走无线网卡（WiFi）
id 1

# port <端口号> <int|ext> [网络号] <本地UDP> <对端IP> <对端UDP> [bind 本地IP] [dev 网卡] [type 介质]
port 1 int        1101 127.0.0.1 3001                                    # 连节点2（同机回环）
port 2 int        1102 @B_WIFI@  2002 bind @A_WIFI@ dev ens37 type wifi  # 连节点3（无线 WiFi）
port 3 ext 0x0A   1103 127.0.0.1 9001 type eth                           # 上行信道 0x0A（本机主机 0x0A01）

# 内部转发表
ift 0102 1
ift 0103 1,2        # 端口2=无线直达节点3；端口1=经节点2 再走有线到节点3（等价路径）
ift 0104 1
ift 0B00 1          # 下行 0x0B 在节点2
ift 0C00 1,2        # 下行 0x0C 在节点3：两条等价路径（一条无线、一条有线）
ift 0D00 1          # 下行 0x0D 在节点4
