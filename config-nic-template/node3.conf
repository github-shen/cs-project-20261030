# 节点3 —— 双介质部署模板（@XXX@ 占位符由 scripts/nic.sh gen 替换成真实 IP）
# 跑在 B 机。端口2 = 域内 1—3 链路（无线）；端口1/4 走有线
id 3

port 1 int        2001 @A_ETH@   3003 bind @B_ETH@  dev ens33 type eth   # 连节点2（有线）
port 2 int        2002 @A_WIFI@  1102 bind @B_WIFI@ dev ens37 type wifi  # 连节点1（无线）
port 3 int        2003 127.0.0.1 4002                                    # 连节点4（同机回环）
port 4 ext 0x0C   2104 @A_ETH@   9003 bind @B_ETH@  dev ens33 type eth   # 下行 0x0C（有线，主机在 A 机）

ift 0101 2          # 经无线 1—3 直达节点1
ift 0102 1          # 经有线 2—3 直达节点2
ift 0104 3
ift 0A00 2          # 上行经无线 1—3 到节点1
ift 0B00 1          # 0x0B 在节点2（有线）
ift 0D00 3          # 0x0D 在节点4
