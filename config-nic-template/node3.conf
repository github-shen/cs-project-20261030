# 节点3 — 题图端口编号；config-nic-template
id 3

port 1 int 2001 @A_ETH@ 3003 bind @B_ETH@ dev ens33 type eth # 节点2/端口3
port 2 ext 0x0A 2102 @A_ETH@ 9101 bind @B_ETH@ dev ens33 type eth # upper 共享信道
port 3 ext 0x0C 2103 @A_ETH@ 9103 bind @B_ETH@ dev ens33 type eth # down5 共享信道
port 4 int 2004 127.0.0.1 4004 # 节点4/端口4

# 静态内部转发表；逗号分隔的候选路径按逻辑源/目的地址分流
ift 0101 1,4
ift 0102 1
ift 0104 4
ift 0B00 1,4
