# 节点2 —— 双介质部署模板（@XXX@ 占位符由 scripts/nic.sh gen 替换成真实 IP）
# 跑在 A 机。端口2/3 走有线，端口4（下行 0x0B）走无线
id 2

port 1 int        3001 127.0.0.1 1101                                    # 连节点1（同机回环）
port 2 int        3002 @B_ETH@   4001 bind @A_ETH@  dev ens33 type eth   # 连节点4（有线）
port 3 int        3003 @B_ETH@   2001 bind @A_ETH@  dev ens33 type eth   # 连节点3（有线）
port 4 ext 0x0B   3104 @B_WIFI@  9002 bind @A_WIFI@ dev ens37 type wifi  # 下行 0x0B（无线，主机在 B 机）

ift 0101 1
ift 0103 3          # 经有线 2—3
ift 0104 2          # 经有线 2—4
ift 0A00 1          # 上行在节点1
ift 0C00 3          # 0x0C 在节点3：走有线 2—3（与节点1 的无线路径构成等价）
ift 0D00 2          # 0x0D 在节点4
