# 节点2 — 题图端口编号；config-nic-template
id 2

port 1 ext 0x0B 3101 @B_WIFI@ 9102 bind @A_WIFI@ dev ens37 type wifi # down3 共享信道
port 2 int 3002 @B_ETH@ 4002 bind @A_ETH@ dev ens33 type eth # 节点4/端口2
port 3 int 3003 @B_ETH@ 2001 bind @A_ETH@ dev ens33 type eth # 节点3/端口1
port 4 int 3004 127.0.0.1 1101 # 节点1/端口1

# 静态内部转发表；逗号分隔的候选路径按逻辑源/目的地址分流
ift 0101 4
ift 0103 3
ift 0104 2
ift 0A00 4,3
ift 0C00 3
