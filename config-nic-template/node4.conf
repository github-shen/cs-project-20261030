# 节点4 —— 双介质部署模板（@XXX@ 占位符由 scripts/nic.sh gen 替换成真实 IP）
# 跑在 B 机。全部走有线
id 4

port 1 int        4001 @A_ETH@   3002 bind @B_ETH@ dev ens33 type eth    # 连节点2（有线）
port 2 int        4002 127.0.0.1 2003                                    # 连节点3（同机回环）
port 3 ext 0x0D   4103 @A_ETH@   9004 bind @B_ETH@ dev ens33 type eth    # 下行 0x0D（有线，主机在 A 机）

ift 0101 1          # 经节点2 → 节点1
ift 0102 1
ift 0103 2
ift 0A00 1
ift 0B00 1
ift 0C00 2          # 0x0C 在节点3
