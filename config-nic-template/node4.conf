# 节点4 — 题图端口编号；config-nic-template
id 4

port 1 ext 0x0B 4101 @B_WIFI@ 9102 bind @B_WIFI@ dev ens37 type wifi # down3 共享信道
port 2 int 4002 @A_ETH@ 3002 bind @B_ETH@ dev ens33 type eth # 节点2/端口2
port 3 int 4003 @A_WIFI@ 1102 bind @B_WIFI@ dev ens37 type wifi # 节点1/端口2
port 4 int 4004 127.0.0.1 2004 # 节点3/端口4
port 5 ext 0x0C 4105 @A_ETH@ 9103 bind @B_ETH@ dev ens33 type eth # down5 共享信道

# 静态内部转发表；逗号分隔的候选路径按逻辑源/目的地址分流
ift 0101 3
ift 0102 2
ift 0103 4
ift 0A00 3,4
