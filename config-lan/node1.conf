# 节点1 —— 跨机部署，跑在 A 机（192.168.222.128）
# 同机节点走 127.0.0.1，跨机节点写对端真实 IP
id 1

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP> [bind <IP>] [dev <网卡>] [type <eth|wifi|bt>]
port 1 int        1101 127.0.0.1 3001              # 连节点2（同机 A）
port 2 int        1102 192.168.222.130 2002        # 连节点3（在 B 机）
port 3 ext 0x0A   1103 127.0.0.1 9001 type eth     # 上行信道 -> 本机主机 0x0A01

ift 0102 1
ift 0103 1,2
ift 0104 1
ift 0B00 1
ift 0C00 1,2
ift 0D00 1
