# 节点1 —— 运行在 VM-A
# ★ 仅需替换 1 个占位符: <VM-B_WiFi_IP> = VM-B 的 ens33 地址(如 192.168.37.61)
id 1

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        1001 <VM-B_WiFi_IP>   3001   # 对端=节点2的本地UDP 3001
port 2 int        1002 127.0.0.1        2002   # 本机回环 -> 节点3
port 3 ext 0x0A   1103 127.0.0.1        9001   # 外部主机0x0A01 监听 9001

# ---- 内部转发表 ----
ift 0102 1          # 目的节点2 -> 端口1
ift 0103 1,2        # 目的节点3 -> 两条等价路径(负载均衡)
ift 0104 1          # 目的节点4 -> 经节点2
ift 0B00 1          # 下行信道3 -> 节点2
ift 0C00 1,2        # 下行信道5 -> 两条等价路径
