# 节点4 —— 运行在 VM-B
# ★ 仅需替换 1 个占位符: <VM-A_VMnet1_IP> = VM-A 的 ens37 地址(如 192.168.107.129)
id 4

port 1 int        4001 127.0.0.1        3002   # 本机回环 -> 节点2
port 2 int        4002 <VM-A_VMnet1_IP> 2003   # 对端=节点3的本地UDP 2003 (VMnet1信道)

# ---- 内部转发表 ----
ift 0101 1,2        # 节点1 -> 回环 或 经节点3(VMnet1), 跨信道负载均衡
ift 0102 1          # 节点2 -> 端口1(回环)
ift 0103 2          # 节点3 -> 端口2(VMnet1)
ift 0A00 1,2        # 上行信道 -> 两条等价路径
ift 0B00 1          # 下行信道3 -> 经节点2(回环)
ift 0C00 2          # 下行信道5 -> 经节点3(VMnet1)
