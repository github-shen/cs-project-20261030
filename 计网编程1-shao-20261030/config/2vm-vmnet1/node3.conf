# 节点3 —— 运行在 VM-A
# ★ 仅需替换 2 个占位符:
#   <VM-B_WiFi_IP>  = VM-B 的 ens33 地址(如 192.168.37.61)
#   <VM-B_VMnet1_IP>= VM-B 的 ens37 地址(如 192.168.107.130)
id 3

port 1 int        2001 <VM-B_WiFi_IP>    3003   # 对端=节点2的本地UDP 3003
port 2 int        2002 127.0.0.1         1002   # 本机回环 -> 节点1
port 3 int        2003 <VM-B_VMnet1_IP>  4002   # 对端=节点4的本地UDP 4002 (VMnet1信道)
port 4 ext 0x0C   2104 127.0.0.1         9003   # 外部主机0x0C01 监听 9003

# ---- 内部转发表 ----
ift 0101 1,2        # 节点1 -> 两条等价路径
ift 0102 1,3        # 节点2 -> WiFi 或 经节点4(VMnet1), 跨信道负载均衡
ift 0104 3          # 节点4 -> 端口3(VMnet1)
ift 0A00 2          # 上行信道 -> 经节点1(回环)
ift 0B00 1,3        # 下行信道3 -> WiFi 或 经节点4(VMnet1), 跨信道负载均衡
