# 节点2 —— 运行在 VM-B
# ★ 仅需替换 1 个占位符: <VM-A_WiFi_IP> = VM-A 的 ens33 地址(如 192.168.37.148)
id 2

port 1 int        3001 <VM-A_WiFi_IP>   1001   # 对端=节点1的本地UDP 1001
port 2 int        3002 127.0.0.1       4001   # 本机回环 -> 节点4
port 3 int        3003 <VM-A_WiFi_IP>  2001   # 对端=节点3的本地UDP 2001
port 4 ext 0x0B   3104 127.0.0.1       9002   # 外部主机0x0B01 监听 9002

# ---- 内部转发表 ----
ift 0101 1          # 节点1 -> 端口1
ift 0103 2,3        # 节点3 -> 两条等价路径
ift 0104 2          # 节点4 -> 端口2(回环)
ift 0A00 1          # 上行信道 -> 节点1
ift 0C00 2,3        # 下行信道5 -> 两条等价路径
