# 节点3配置
id 3

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        2001 127.0.0.1 3003   # 连节点2 端口3
port 2 int        2002 127.0.0.1 1002   # 连节点1 端口2
port 3 int        2003 127.0.0.1 4002   # 连节点4 端口2
port 4 ext 0x0C   2104 127.0.0.1 9003   # 下行逻辑信道5(网络0x0C) -> 主机9003

# ---- 内部转发表 ----
ift 0101 1,2        # 节点1 -> 经节点2(端口1) 或 直连(端口2), 负载均衡
ift 0102 1,3        # 节点2 -> 直连(端口1) 或 经节点4(端口3), 负载均衡
ift 0104 3          # 节点4 -> 端口3
ift 0A00 2          # 上行信道(0x0A) -> 经节点1(端口2)
ift 0B00 1,3        # 下行信道3(0x0B) -> 两条等价路径,负载均衡
