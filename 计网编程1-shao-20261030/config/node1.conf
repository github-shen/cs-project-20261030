# 节点1配置  (单机回环版: 所有IP为127.0.0.1; 多机部署时改为对端真实IP)
# id <节点号>
id 1

# ---- 端口 ----
# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        1001 127.0.0.1 3001   # 连节点2 端口1
port 2 int        1002 127.0.0.1 2002   # 连节点3 端口2
port 3 ext 0x0A   1103 127.0.0.1 9001   # 上行逻辑信道(网络0x0A) -> 主机9001

# ---- 内部转发表 ----
# ift <目的键hex> <端口1[,端口2]>   两个端口为等价路径,按流哈希负载均衡
ift 0102 1          # 目的节点2 -> 端口1
ift 0103 1,2        # 目的节点3 -> 经节点2(端口1) 或 经节点4->...此处两条等价:端口1/端口2
ift 0104 1          # 目的节点4 -> 经节点2(端口1)
ift 0B00 1          # 下行信道3(网络0x0B) -> 经节点2(端口1)
ift 0C00 1,2        # 下行信道5(网络0x0C) -> 两条等价路径,负载均衡
