# 节点3 —— 运行在 VM-A (192.168.1.101 / 192.168.2.101)
id 3

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        2001 192.168.1.102 3003   # [WiFi信道] -> 节点2 (VM-B)
port 2 int        2002 127.0.0.1     1002   # [本机回环] -> 节点1 (VM-A)
port 3 int        2003 192.168.2.102 4002   # [第二信道: 有线/蓝牙] -> 节点4 (VM-B)
port 4 ext 0x0C   2104 127.0.0.1     9003   # 下行逻辑信道5 -> 主机0x0C01 (VM-A本机)

# ---- 内部转发表 ----
ift 0101 1,2        # 节点1 -> 经节点2(WiFi) 或 回环, 负载均衡
ift 0102 1,3        # 节点2 -> WiFi 或 经节点4(第二信道), 负载均衡
ift 0104 3          # 节点4 -> 第二信道(端口3)
ift 0A00 2          # 上行信道 -> 经节点1(回环)
ift 0B00 1,3        # 下行信道3 -> 经节点2(WiFi) 或 经节点4(第二信道), 跨介质负载均衡
