# 节点1 —— 运行在 VM-A (192.168.1.101 / 192.168.2.101)
# 真实信道版: 跨VM链路填真实IP, 同VM链路仍用127.0.0.1
id 1

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        1001 192.168.1.102 3001   # [WiFi信道] -> 节点2 (VM-B)
port 2 int        1002 127.0.0.1     2002   # [本机回环] -> 节点3 (VM-A)
port 3 ext 0x0A   1103 127.0.0.1     9001   # 上行逻辑信道 -> 主机0x0A01 (VM-A本机)

# ---- 内部转发表 ----
ift 0102 1          # 节点2 -> WiFi信道(端口1)
ift 0103 1,2        # 节点3 -> 经节点2(WiFi) 或 直连(回环), 负载均衡
ift 0104 1          # 节点4 -> 经节点2(WiFi)
ift 0B00 1          # 下行信道3 -> 经节点2(WiFi)
ift 0C00 1,2        # 下行信道5 -> WiFi / 回环 两条等价路径, 跨介质负载均衡
