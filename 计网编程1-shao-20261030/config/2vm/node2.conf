# 节点2 —— 运行在 VM-B (192.168.1.102 / 192.168.2.102)
id 2

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        3001 192.168.1.101 1001   # [WiFi信道] -> 节点1 (VM-A)
port 2 int        3002 127.0.0.1     4001   # [本机回环] -> 节点4 (VM-B)
port 3 int        3003 192.168.1.101 2001   # [WiFi信道] -> 节点3 (VM-A)
port 4 ext 0x0B   3104 127.0.0.1     9002   # 下行逻辑信道3 -> 主机0x0B01 (VM-B本机)

# ---- 内部转发表 ----
ift 0101 1          # 节点1 -> WiFi信道(端口1)
ift 0103 2,3        # 节点3 -> 经节点4(回环) 或 WiFi直连, 负载均衡
ift 0104 2          # 节点4 -> 回环(端口2)
ift 0A00 1          # 上行信道 -> 经节点1(WiFi)
ift 0C00 2,3        # 下行信道5 -> 回环 或 WiFi, 负载均衡
