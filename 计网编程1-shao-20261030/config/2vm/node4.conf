# 节点4 —— 运行在 VM-B (192.168.1.102 / 192.168.2.102)
id 4

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        4001 127.0.0.1     3002   # [本机回环] -> 节点2 (VM-B)
port 2 int        4002 192.168.2.101 2003   # [第二信道: 有线/蓝牙] -> 节点3 (VM-A)

# ---- 内部转发表 ----
ift 0101 1,2        # 节点1 -> 经节点2(回环) 或 经节点3(第二信道), 跨介质负载均衡
ift 0102 1          # 节点2 -> 回环(端口1)
ift 0103 2          # 节点3 -> 第二信道(端口2)
ift 0A00 1,2        # 上行信道 -> 回环 / 第二信道, 两种介质负载均衡
ift 0B00 1          # 下行信道3 -> 经节点2(回环)
ift 0C00 2          # 下行信道5 -> 经节点3(第二信道)
