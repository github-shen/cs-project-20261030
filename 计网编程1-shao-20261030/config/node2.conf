# 节点2配置
id 2

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP>
port 1 int        3001 127.0.0.1 1001   # 连节点1 端口1
port 2 int        3002 127.0.0.1 4001   # 连节点4 端口1
port 3 int        3003 127.0.0.1 2001   # 连节点3 端口1
port 4 ext 0x0B   3104 127.0.0.1 9002   # 下行逻辑信道3(网络0x0B) -> 主机9002

# ---- 内部转发表 ----
ift 0101 1          # 节点1 -> 端口1
ift 0103 2,3        # 节点3 -> 经节点4(端口2) 或 直连(端口3), 负载均衡
ift 0104 2          # 节点4 -> 端口2
ift 0A00 1          # 上行信道(0x0A) -> 经节点1(端口1)
ift 0C00 2,3        # 下行信道5(0x0C) -> 两条等价路径,负载均衡
