# 节点1配置 —— OVS 模式（域内链路跑在 Open vSwitch 的 br-int 上）
# 先执行: sudo bash scripts/ovs_setup.sh
# 域内地址约定: 节点k = 10.1.0.k (OVS internal port ovsk)
id 1

# port <端口号> <int|ext> [外部网络号hex] <本地UDP> <对端IP> <对端UDP> [bind <本地IP>] [dev <网卡>] [type <eth|wifi|bt>]
# ---- 内部端口：绑定到 OVS 内部端口 ovs1 的地址，链路真实经过 br-int 二层转发 ----
port 1 int        1101 10.1.0.2 3001 bind 10.1.0.1
port 2 int        1102 10.1.0.3 2002 bind 10.1.0.1

# ---- 外部端口：单机演示仍用 127.0.0.1；多机时改成真实网卡IP并加 bind ----
port 3 ext 0x0A   1103 127.0.0.1 9001 type eth

# ---- 内部转发表 ----
ift 0102 1
ift 0103 1,2
ift 0104 1
ift 0B00 1
ift 0C00 1,2
ift 0D00 1
